<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gift the Couple - Walimatul Nikkah</title>
    <link href="/src/style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  </head>
  <body class="bg-rose-light font-sans">

    <main class="max-w-md mx-auto min-h-screen bg-[#EEE6E6] relative pb-24">

      <header class="fixed top-0 left-0 right-0 bg-maroon px-6 py-3 flex items-center justify-between z-50 max-w-md mx-auto w-full">
        <img src="img/solar_heart-bold-duotone.svg" alt="">

        <div class="flex items-center gap-3">
          <a href="/rsvp.html" class="bg-white text-maroon px-8 py-1 rounded-full font-semibold">
            R.S.V.P
          </a>
        </div>
      </header>

      <!-- Main Gift Page -->
      <section id="giftMain" class="px-6 pt-24 pb-8">
        <h2 class="text-gray-800 text-3xl font-bold text-center mb-8">Gift the Couple</h2>

        <div class="mb-8">
          <img src="img/pana.svg" alt="Gift the Couple" class="w-full max-w-sm mx-auto">
        </div>

        <div class="flex justify-between gap-4">
          <button id="cashBtn" class="bg-[#E5D9D9] rounded-2xl p-4 flex-1 hover:shadow-lg transition">
            <div class="mb-4 rounded-lg overflow-hidden">
              <img src="img/cash.svg" alt="Gift Cash" class="w-full">
            </div>
            <h3 class="text-gray-800 font-semibold text-sm text-center">Gift Cash</h3>
          </button>

          <button id="wishlistBtn" class="bg-[#E5D9D9] rounded-2xl py-2 px-2 flex flex-col items-center flex-1 hover:shadow-lg transition">
            <div class="mb-10 rounded-lg overflow-hidden">
              <img src="img/wishlist.svg" alt="Fulfill Couple's Wishlist" class="w-full">
            </div>
            <h3 class="text-gray-800 font-semibold text-sm text-center -mt-5">Fulfill Couple's Wishlist</h3>
          </button>
        </div>
      </section>

      <!-- Wishlist Page -->
      <section id="wishlistPage" class="pt-20 pb-8 hidden">
        <div class="bg-rose-light px-6 py-4 flex items-center relative">
          <button id="backBtn" class="text-gray-700 absolute left-6">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
            </svg>
          </button>
          <h2 class="text-gray-700 text-2xl font-medium text-center flex-1">Couple's Wishlist</h2>
        </div>

        <div id="wishlistContainer" class="px-6 mt-6 space-y-4">
          <!-- Wishlist items will be dynamically generated here -->
        </div>
      </section>

      <!-- Cash Gift Modal -->
      <div id="cashModal" class="fixed left-0 right-0 top-0 bottom-16 bg-black/50 z-50 hidden items-end">
        <div id="cashModalContent" class="bg-rose-light rounded-t-3xl w-full max-w-md mx-auto relative transform translate-y-full transition-transform duration-300">
          <div class="relative w-full pt-6 pb-4 flex items-center px-4">
                <h3 class="absolute left-1/2 -translate-x-1/2 text-center text-[#363636] text-2xl font-semibold">
                    Cash Gift
                </h3>

                <button id="closeModal" class="ml-auto">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
                    <circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="2" fill="none"/>
                    <path d="M7 7l6 6M13 7l-6 6" stroke="currentColor" stroke-width="2"/>
                    </svg>
                </button>
            </div>
          <div class="px-6 pb-6 space-y-4 max-h-[55vh] overflow-y-auto">
            <div>
              <label class="text-black text-base font-normal block mb-2">Full name</label>
              <input type="text" placeholder="Enter your name" class="w-full px-4 py-3 rounded-md bg-[#E5D9D9] text-gray-800 placeholder-[#949494] focus:outline-none">
            </div>

            <div>
              <label class="text-black text-base font-normal block mb-2">Email address</label>
              <input type="email" placeholder="example@gmail.com" class="w-full px-4 py-3 rounded-md bg-[#E5D9D9] text-gray-800 placeholder-[#949494] focus:outline-none">
            </div>

            <div>
              <label class="text-black text-base font-normal block mb-2">Phone number</label>
              <input type="tel" placeholder="Enter your phone number" class="w-full px-4 py-3 rounded-md bg-[#E5D9D9] text-gray-800 placeholder-[#949494] focus:outline-none">
            </div>

            <div>
              <label class="text-black text-base font-normal block mb-2">Amount</label>
              <input id="amountInput" type="number" placeholder="Enter the amount you want to gift" class="w-full px-4 py-3 rounded-md bg-[#E5D9D9] text-gray-800 placeholder-[#949494] focus:outline-none">
            </div>

            <div class="flex flex-col gap-2 justify-center items-center">
                <div>
                <button type="button" class="amount-btn px-2 py-2 border border-maroon text-sm rounded hover:bg-maroon hover:text-white transition" data-amount="5000">5,000</button>
                <button type="button" class="amount-btn px-2 py-2 border border-maroon text-sm rounded hover:bg-maroon hover:text-white transition" data-amount="10000">10,000</button>
                <button type="button" class="amount-btn px-2 py-2 border border-maroon text-sm rounded hover:bg-maroon hover:text-white transition" data-amount="20000">20,000</button>
                <button type="button" class="amount-btn px-2 py-2 border border-maroon text-sm rounded hover:bg-maroon hover:text-white transition" data-amount="50000">50,000</button>
              </div>
              <button type="button" class="amount-btn px-2 py-2 border border-maroon text-sm rounded hover:bg-maroon hover:text-white transition" data-amount="100000">100,000</button>
              
            </div>

            <button class="w-full bg-maroon text-white py-3.5 rounded-lg font-semibold flex items-center justify-center gap-2 mt-2 hover:opacity-90 transition">
              <img src="img/paystack-icon.svg" alt="" class="w-5 h-5">
              Pay via Paystack
            </button>
          </div>
        </div>
      </div>
    </main>
    
    <footer class="bg-maroon text-white py-4 max-w-md mx-auto fixed bottom-0 left-0 right-0 z-40">
      <nav class="flex items-center justify-around px-4">
        <a href="/" class="flex flex-col items-center gap-1 hover:opacity-80 text-white/60 nav-link">
          <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
            <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path>
          </svg>
          <span class="text-xs">Home</span>
        </a>
        
        <a href="/venue.html" class="flex flex-col items-center gap-1 hover:opacity-80 text-white/60 nav-link">
          <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"></path>
          </svg>
          <span class="text-xs">Venue</span>
        </a>
        
        <a href="/gift.html" class="flex flex-col items-center gap-1 hover:opacity-80 text-white nav-link active">
          <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M5 5a3 3 0 015-2.236A3 3 0 0114.83 6H16a2 2 0 110 4h-5V9a1 1 0 10-2 0v1H4a2 2 0 110-4h1.17C5.06 5.687 5 5.35 5 5zm4 1V5a1 1 0 10-1 1h1zm3 0a1 1 0 10-1-1v1h1z" clip-rule="evenodd"></path>
            <path d="M9 11H3v5a2 2 0 002 2h4v-7zM11 18h4a2 2 0 002-2v-5h-6v7z"></path>
          </svg>
          <span class="text-xs">Gift couple</span>
        </a>
        
        <a href="/rsvp.html" class="flex flex-col items-center gap-1 hover:opacity-80 text-white/60 nav-link">
          <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd"></path>
          </svg>
          <span class="text-xs">R.S.V.P</span>
        </a>
        
        <a href="/order-of-events.html" class="flex flex-col items-center gap-1 hover:opacity-80 text-white/60 nav-link">
          <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
            <path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"></path>
            <path fill-rule="evenodd" d="M4 5a2 2 0 012-2 3 3 0 003 3h2a3 3 0 003-3 2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V5zm3 4a1 1 0 000 2h.01a1 1 0 100-2H7zm3 0a1 1 0 000 2h3a1 1 0 100-2h-3zm-3 4a1 1 0 100 2h.01a1 1 0 100-2H7zm3 0a1 1 0 100 2h3a1 1 0 100-2h-3z" clip-rule="evenodd"></path>
          </svg>
          <span class="text-xs">Program</span>
        </a>
      </nav>
    </footer>
    
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
